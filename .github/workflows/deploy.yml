name: 部署笔记站

# push 到 main 分支时自动构建并发布到 GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:      # 允许在 GitHub 网页手动点一下重新部署

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # gh-deploy 需要完整历史来计算 gh-pages 分支

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 配置提交身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 构建并推送到 gh-pages 分支
        run: mkdocs gh-deploy --force --clean
