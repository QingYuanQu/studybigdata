name: 部署笔记站

# push 到 main 分支时自动构建并发布到 QingYuanQu.github.io (自定义域名 www.studybigdata.com)
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:      # 允许在 GitHub 网页手动点一下重新部署

permissions:
  contents: read          # 仅读源码；推 io 仓库用 GH_TOKEN secret

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 完整历史

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 构建站点
        run: mkdocs build --clean

      - name: 部署到 QingYuanQu.github.io 的 gh-pages 分支
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd _site
          touch .nojekyll
          git init -q
          git checkout -q -B gh-pages
          git add -A
          git -c user.email="ci@github.com" -c user.name="github-actions[bot]" commit -q -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add io "https://x-access-token:${GH_TOKEN}@github.com/QingYuanQu/QingYuanQu.github.io.git"
          git push io gh-pages --force
