{% extends "base.html" %}

{% block scripts %}
  {{ super() }}
  <script>
    // 在侧边栏顶部注入 GitHub 入口 + 搜索提示，替代被隐藏的 header
    document.addEventListener("DOMContentLoaded", function () {
      var sidebar = document.querySelector(".md-sidebar__inner");
      if (!sidebar || document.getElementById("sidebar-quick")) return;

      var box = document.createElement("div");
      box.id = "sidebar-quick";
      box.className = "sidebar-quick";
      box.innerHTML =
        '<a href="https://github.com/qingyuanqu/studybigdata" ' +
        'target="_blank" rel="noopener">GitHub 仓库 ↗</a>' +
        '<span class="hint">按 / 键搜索</span>';

      sidebar.insertBefore(box, sidebar.firstChild);
    });
  </script>
{% endblock %}
